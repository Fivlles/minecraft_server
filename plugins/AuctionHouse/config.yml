auction stack:

  header:
  - '&7&m-------------------------'

  seller lines:
  - '&d&nSeller&r &d➤ &f%seller%'

  requester lines:
  - '&d&nRequester&r &d➤ &f%requester%'
  - ''

  request price lines:
  - '&d&nOffering&r &d➤ &f%request_price%'

  request count lines:
  - '&d&nRequest Amt&r &d➤ &f%request_amount%'
  - ''

  buy now lines:
  - '&d&nBuy Now&r &d➤ &f%buynowprice%'

  current price lines:
  - '&d&nCurrent Price &d➤ &f%currentprice%'

  bid increment lines:
  - '&d&nBid Increment &d➤ &f%bidincrement%'

  highest bidder lines:
  - '&d&nHighest Bidder &d➤ &f%highestbidder%'

  priority listing lines:
  - <GRADIENT:F55C7A>&LPriority Listing</GRADIENT:F6BC66>

  time left lines:
  - '&d&nTime Left&r &d➤ &f%remaining_days%d %remaining_hours%h %remaining_minutes%m %remaining_seconds%s'

  # this will be used instead of the time left if the item is infinite
  infinite lines:
  - '&d&nTime Left&r &d➤ &fNo Expiration'
  controls:

    header:
    - '&7&m-------------------------'

    footer:
    - '&7&m-------------------------'

    # This will only be added to the control lore if the item can be inspected (skulker box/bundled item)
    inspection:
    - ''
    - '&d&nShift Right-Click&r &d➤ &fto inspect'

    # This will only show on items within the active listings menu on biddable items.
    accept bid:
    - '&dRight-Click to accept the current bid'

    # This will only show on items within the active listings menu
    priority listing:
    - '&dShift + Left-Click &fto prioritize listing'

    cancel item:
    - '&dLeft-Click &fto cancel this listing'

    cancel request:
    - '&dLeft-Click &fto cancel this request'

    preview item:
    - '&dPreviewing Listing'

    highest bidder:
    - '&dCurrently Winning!'

    # This will be appended at the end of the lore
    # If the auction item is using a bid, this will show
    using bid:
    - '&d&nLeft-Click&r &d➤ &fBid'
    - '&d&nRight-Click&r &d➤ &fBuy Now'

    # This will be appended at the end of the lore
    # If the auction item is using a bid, this will show
    using bid without buy now:
    - '&d&nLeft-Click&r &d➤ &fBid'

    # This will be appended at the end of the lore
    # If the listing is a request this will be shown to fulfill
    fulfill request:
    - '&d&nLeft-Click&r &d➤ &fFulfill Request'

    # This will be appended at the end of the lore
    # If the auction item is not using a bid, this will show
    not using bid:
    - '&d&nLeft-Click&r &d➤ &fBuy Now'

    # This will be appended at the end of the lore
    # If the auction item allows partial buys, this will be added
    partial buy:
    - '&d&nShift Left-Click&r &d➤ &fBuy Quantity'

  # The info order for the stacks, if a listing doesnt require one of these, Auction House will just ignore it.
  # This is mainly used to just change the ordering of listing stack information
  info layout:
  - '%original_item_lore%'
  - '%header%'
  - '%seller%'
  - '%highest_bidder%'
  - ''
  - '%buy_now_price%'
  - '%current_price%'
  - '%bid_increment%'
  - ''
  - '%listing_time%'
  - '%listing_priority%'
  - '%controls_header%'
  - '%controls%'
  - '%controls_footer%'

sounds:

  listed item on the auction house: ENTITY_EXPERIENCE_ORB_PICKUP

  navigated between gui pages: ENTITY_BAT_TAKEOFF

  not enough money: ENTITY_ITEM_BREAK
